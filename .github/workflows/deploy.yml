name: Deploy static build

# Build the game with `npm run build` and publish the result to GitHub Pages so
# there is always a playable, player-facing build at the repository's Pages
# URL. Netlify remains configured (netlify.toml) as an alternative host.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the Pages deployment: read the repo, write the Pages
# site, and mint an OIDC token for `actions/deploy-pages`.
permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time. Do not cancel an in-progress deploy, so a
# newer push waits its turn instead of leaving Pages half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Project pages live under /<repo>/, so tell Vite the base path. The
        # name comes from the repository, keeping this workflow fork-safe.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
