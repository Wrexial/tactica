name: Deploy static build

# Build the game with `npm run build` and publish the result to GitHub Pages so
# there is always a playable, player-facing build at the repository's Pages
# URL. Netlify remains configured (netlify.toml) as an alternative host.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the Pages deployment: read the repo, write the Pages
# site, and mint an OIDC token for `actions/deploy-pages`.
permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time. Do not cancel an in-progress deploy, so a
# newer push waits its turn instead of leaving Pages half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The deploy job only runs when Pages is actually available (see the
    # "Configure Pages" step). A repository that has never enabled Pages would
    # otherwise fail this workflow on every push with an opaque action error.
    outputs:
      pages-ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Project pages live under /<repo>/, so tell Vite the base path. The
        # name comes from the repository, keeping this workflow fork-safe.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        id: pages
        # A repository whose Pages site does not exist yet fails here: the
        # token can request enablement, but only an administrator may create
        # the site. Keep the run green and explain the one-time fix instead of
        # failing every push with an opaque action error.
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Report Pages unavailable
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages is not enabled::Skipping the deploy. Open Settings → Pages, set Source to \"GitHub Actions\", then re-run this workflow (or push again). See README → Checks and deployment."

      - name: Upload build artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # Skipped (not failed) until Pages is enabled for the repository.
    if: needs.build.outputs.pages-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
